aid: gte
name: GTE
description: >-
  GTE (Global Token Exchange) is a non-custodial, permissionless decentralized exchange
  built on MegaETH, offering a central limit order book (CLOB) with CEX-level speed —
  advertised at 100,000 orders per second and ~1ms latency — combined with DeFi security
  properties. Users trade crypto and tokenized assets 24/7 from a self-custodied wallet,
  with spot and leveraged/perpetual markets, shortable positions, and on-chain settlement.
  GTE exposes a public HTTP + WebSocket API (GTE API v1) covering tokens, markets, candles,
  trades, order books, and per-wallet portfolio/order data, plus a signed POST /exchange
  endpoint for submitting orders and trades. An official Python SDK (gte-py) constructs the
  signed transaction bodies. GTE is developed by Liquid Labs and backed by Paradigm.
